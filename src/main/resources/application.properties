spring.application.name=diabetes-backend
server.port=${PORT:8080}

# Frontend (Vercel)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://glucopal-peach.vercel.app}
# optional, e.g. https://*-yourteam.vercel.app for preview deployments
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# PostgreSQL (Supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA: "update" keeps existing data (the old "create" wiped all tables on every start)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Firebase Admin (service-account key as base64 or raw JSON)
firebase.service-account-b64=${FIREBASE_SERVICE_ACCOUNT_B64:}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Python AI service
python.ai.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}

# Health check for Koyeb
management.endpoints.web.exposure.include=health

logging.level.com.diabetesapp=INFO
